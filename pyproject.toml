[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fanar-mcp"
version = "0.1.0"
description = "MCP server for Fanar, QCRI's Arabic-centric AI platform: chat, cited Islamic Q&A, Qur'an and hadith quotation checks, deep research, translation, speech and images."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Blade Labs" }]
keywords = ["mcp", "model-context-protocol", "fanar", "arabic", "islamic-finance", "qcri", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Arabic",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.10,<2"]  # v2 renamed FastMCP to MCPServer; port tracked as a follow-up

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fanar-mcp = "fanar_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fanar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
