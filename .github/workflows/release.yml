name: release

# Publishes to PyPI when a version tag is pushed, through PyPI trusted publishing (no stored token).
# One-time setup on pypi.org: add a pending publisher for project "fanar-mcp", owner "Blade-Labs",
# repository "fanar-mcp", workflow "release.yml", environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PyPI to serve the new version
        run: |
          for i in $(seq 1 30); do
            curl -sf https://pypi.org/pypi/fanar-mcp/${GITHUB_REF_NAME#v}/json >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Install mcp-publisher
        run: curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
