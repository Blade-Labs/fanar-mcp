name: release

# Publishes to PyPI when a version tag is pushed, through PyPI trusted publishing (no stored token).
# One-time setup on pypi.org: add a pending publisher for project "fanar-mcp", owner "Blade-Labs",
# repository "fanar-mcp", workflow "release.yml", environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
